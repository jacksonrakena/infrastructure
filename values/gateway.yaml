infrastructure:
  annotations:
    oci.oraclecloud.com/load-balancer-type: nlb

# Grafana's route lives in the monitoring namespace.
allowedRouteNamespaces:
  - prod
  - monitoring

listeners:
  https-rakenaconz:
    hostname: "*.rakena.co.nz"
    certificateSecret: tls-rakena-co-nz
  https-jacksonrakenacom:
    hostname: "*.jacksonrakena.com"
    certificateSecret: tls-jacksonrakena-com
  # Catch-all: rakena.com.au hosts and anything else (e.g. api.gradekeeper.xyz).
  https-rakenacomau:
    certificateSecret: tls-rakena-com-au
