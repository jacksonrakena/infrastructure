# Uses the local app chart rather than homarr-labs/homarr: that chart can't mount
# a subPath of an existing claim, which is where Homarr's data lives.
# Tag for readability, digest so the image can't change under the tag.
image: ghcr.io/homarr-labs/homarr:v2.13.1@sha256:7b3ab85bad2656be6c940b9d26117254edb6d998aeb5b66dfdc795f2e737802a
containerPort: 7575
strategy:
  type: Recreate
envFromSecrets: [homarr-env]       # SECRET_ENCRYPTION_KEY
env:
  ENABLE_KUBERNETES: "true"
volumes:
  appdata:
    persistentVolumeClaim:
      claimName: arthur-global-data
    mountPath: /appdata
    subPath: homarr-appdata
# arthur-global-data is ReadWriteOnce, so run on Vaultwarden's node.
affinity:
  podAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: vaultwarden
routes:
  home-route:
    hostname: home.rakena.com.au
# Read-only cluster access for Homarr's Kubernetes integration.
clusterAccess:
  enabled: true
  rules:
    - apiGroups: [""]
      resources: [pods, services, nodes, namespaces, configmaps, secrets, persistentvolumes, persistentvolumeclaims]
      verbs: [get, list, watch]
    - apiGroups: [apps]
      resources: [deployments, daemonsets, statefulsets]
      verbs: [get, list, watch]
    - apiGroups: [networking.k8s.io]
      resources: [ingresses]
      verbs: [get, list, watch]
    - apiGroups: [metrics.k8s.io]
      resources: [pods, nodes]
      verbs: [get, list]
