# Pinned to the digest that was running at the Helm migration (2026-11-17).
image: docker.io/vaultwarden/server@sha256:1587c45feaa479f1f5e8af3b00eded36bff77bcf1880cf8dbf0541706dd470e0
containerPort: 80
# Single SQLite writer on a ReadWriteOnce volume.
strategy:
  type: Recreate
envFromSecrets: [vaultwarden-env]
volumes:
  data:
    persistentVolumeClaim:
      claimName: arthur-global-data
    mountPath: /data
    subPath: vaultwarden-data
routes:
  vault-route:
    hostname: vault.rakena.com.au
  vault-co-nz-route:
    hostname: vault.rakena.co.nz
